[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swiglu-triton-inference"
version = "0.1.0"
description = "A reproducible post-projection SwiGLU Triton operator benchmark"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "triton>=2.2"]

[project.optional-dependencies]
test = ["pytest>=7"]
model = ["transformers>=4.44,<5", "sentencepiece>=0.1.99"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
